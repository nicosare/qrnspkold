# Add these locations INSIDE the existing HTTPS server block for tintink.ru.
# This route is intentionally public during development. Add Basic Auth later,
# when the owner asks for password protection.
# Do not replace the server block or edit any other project's locations.

location = /qride {
    return 301 /qride/;
}

location ^~ /qride/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
}
