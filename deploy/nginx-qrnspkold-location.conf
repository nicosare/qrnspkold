# Add these locations INSIDE the existing HTTPS server block for tintink.ru.
# Do not replace the server block or edit any other project's locations.
# Create /etc/nginx/.htpasswd-qrnspkold before enabling this route.

location = /qrnspkold {
    return 301 /qrnspkold/;
}

location ^~ /qrnspkold/ {
    auth_basic "qrnspkold private";
    auth_basic_user_file /etc/nginx/.htpasswd-qrnspkold;

    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
}
