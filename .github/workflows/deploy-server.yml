name: Deploy static site to Roadnote server directory

on:
  push:
    branches:
      - server-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadnote-server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static files to the dedicated directory
    runs-on: ubuntu-latest
    steps:
      - name: Check out server branch
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          for (const file of ['index.html', 'admin-users.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
              .map(match => match[1])
              .filter(script => script.trim());

            scripts.forEach((script, index) => {
              new vm.Script(script, { filename: file + ':inline-script-' + (index + 1) });
            });
            console.log('Syntax OK: ' + file + ' (' + scripts.length + ' inline scripts)');
          }
          NODE

      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.QRNSPKOLD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.QRNSPKOLD_SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.QRNSPKOLD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.QRNSPKOLD_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/server-deploy" ]] || {
            echo "::error::This workflow can deploy only from server-deploy."
            exit 1
          }
          [[ -n "$SERVER_HOST" ]] || { echo "::error::Missing QRNSPKOLD_SERVER_HOST secret."; exit 1; }
          [[ -n "$SERVER_USER" ]] || { echo "::error::Missing QRNSPKOLD_SERVER_USER secret."; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "::error::Missing QRNSPKOLD_SSH_PRIVATE_KEY secret."; exit 1; }
          [[ -n "$KNOWN_HOSTS" ]] || { echo "::error::Missing QRNSPKOLD_KNOWN_HOSTS secret."; exit 1; }

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.QRNSPKOLD_SSH_PRIVATE_KEY }}

      - name: Configure verified SSH host key
        env:
          KNOWN_HOSTS: ${{ secrets.QRNSPKOLD_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove retired tariff pages and deploy current static files
        env:
          SERVER_HOST: ${{ secrets.QRNSPKOLD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.QRNSPKOLD_SERVER_USER }}
          SERVER_PORT: ${{ secrets.QRNSPKOLD_SERVER_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"
          TARGET="/var/www/roadnote"

          # Dedicated target only. Remove only the two retired tariff pages; preserve unrelated remote files.
          ssh -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" \
            'rm -f /var/www/roadnote/admin-offers.html /var/www/roadnote/admin-requests.html'
          rsync -az --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='deploy/' \
            --exclude='.gitignore' \
            -e "ssh -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$SERVER_USER@$SERVER_HOST:$TARGET/"
