services:
  qride-app:
    build: .
    container_name: qride-app
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/qride.sqlite
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - ./data:/data
