<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f3f4">
<title>Roadnote — Пользователи</title>
<style>
:root{color-scheme:light;--bg:#f2f3f4;--card:#fff;--text:#24262b;--muted:#777d87;--line:#e4e7eb;--accent:#2787f5;--soft:#eaf3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:none;margin:0;padding:clamp(12px,2vw,24px) clamp(8px,1.5vw,18px) calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:clamp(23px,5vw,30px);line-height:1.15;letter-spacing:-.5px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px}
.count{flex-shrink:0;font-weight:750;background:var(--soft);color:#1766bc;padding:8px 11px;border-radius:12px;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 5px 22px #15243b08}
.toolbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,auto) auto;gap:8px;margin:0 0 10px;padding:8px 0 10px;background:var(--card);border-bottom:1px solid var(--line)}
input,select,button{min-height:44px;font:inherit;border-radius:11px;padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--text);min-width:0}
input{width:100%}input:focus,select:focus,button:focus-visible,.user-card:focus-visible{outline:2px solid #2787f5;outline-offset:2px}
button{cursor:pointer;font-weight:650}.primary{background:var(--accent);border-color:var(--accent);color:#fff;padding-inline:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));align-items:start;gap:9px}
.user-card{display:block;min-width:0;padding:11px 12px;color:inherit;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.user-card:hover{border-color:#b6d5ff;box-shadow:0 5px 18px #15243b0c}
.user-card:active{transform:scale(.99)}
.person{display:flex;align-items:center;gap:9px;min-width:0;margin-bottom:9px}
.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;object-fit:cover;background:#e7edf5;display:grid;place-items:center;color:#52708e;font-weight:750}
.person-text{min-width:0}.name{font-size:16px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}.vk-id{font-size:12px;color:var(--accent);margin-top:4px}
.open-hint{font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stat{min-width:0;background:#f7f8fa;border-radius:8px;padding:7px 8px}
.stat-label{display:block;color:var(--muted);font-size:11px;line-height:1.3;margin-bottom:4px}
.stat-value{display:block;font-size:13px;font-weight:650;overflow-wrap:anywhere}
.visits{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:4px 7px;border-radius:7px;background:var(--soft);color:#1766bc;font-size:11px;font-weight:750}
.scan-history{margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.scan-history summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;color:#1766bc;font-size:12px;font-weight:750;list-style:none}
.scan-history summary::-webkit-details-marker{display:none}
.scan-history summary::after{content:'＋';font-size:15px}
.scan-history[open] summary::after{content:'−'}
.scan-history-list{display:grid;gap:7px;padding:4px 0 2px}
.scan-row{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fafbfc}
.scan-row-main{font-size:13px;font-weight:750}
.scan-row-meta{font-size:12px;color:var(--muted);margin-top:3px}
.scan-history-empty{font-size:12px;color:var(--muted);padding:6px 0}
.credit-history{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
.credit-history summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;color:#16804a;font-size:12px;font-weight:750;list-style:none}
.credit-history summary::-webkit-details-marker{display:none}
.credit-history summary::after{content:'＋';font-size:15px}
.credit-history[open] summary::after{content:'−'}

.entitlement{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
 .manage summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0 1px;font-size:12px;font-weight:750;color:#1766bc;list-style:none}
 .manage summary::-webkit-details-marker{display:none}.manage summary::after{content:'＋';font-size:15px}.manage[open] summary::after{content:'−'}
 .manage-body{padding-top:8px}.manage .grant-section{margin-top:9px}.manage .grant-section:first-child{margin-top:0}
.entitlement-status{font-size:14px;font-weight:750;margin-bottom:10px}
.entitlement-status small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
.grant-section{margin-top:12px}
.grant-section-title{font-size:12px;font-weight:750;color:var(--muted);margin-bottom:7px}
.preset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.preset-grid button{min-width:0;padding:10px 4px;font-size:13px}
.preset-grid button span{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:3px}
.grant-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:8px}
.grant-grid input{min-width:0}
.grant-grid button,.unlimited-toggle{white-space:nowrap}
@media(max-width:420px){.grant-grid{grid-template-columns:1fr}.preset-grid button{font-size:12px}}
.unlimited-toggle{width:100%;margin-top:8px;background:#f4f7fb}
.action-status{font-size:12px;color:var(--muted);min-height:17px;margin-top:6px}
.action-status.error{color:#b42318}
.admin-nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.admin-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#354150;font-size:13px;font-weight:750}
.admin-nav a.active{background:#eaf3ff;border-color:#bfdaff;color:#1766bc}
.status{padding:30px 12px;text-align:center;color:var(--muted)}.error{color:#b42318}.foot{font-size:12px;line-height:1.5;color:var(--muted);margin-top:16px}
@media(max-width:600px){
 main{padding-top:12px}.top{align-items:flex-start;margin-bottom:12px}.sub{font-size:12px}.count{font-size:12px;padding:6px 8px}
 .toolbar{grid-template-columns:minmax(0,1fr) auto;top:0}.toolbar input{grid-column:1/-1;grid-row:1}.toolbar select{grid-column:1;grid-row:2;min-width:0}.toolbar button{grid-column:2;grid-row:2}.primary{padding-inline:11px}
 .cards{grid-template-columns:minmax(0,1fr);gap:8px}.user-card{padding:10px}.person{margin-bottom:8px}.avatar{width:38px;height:38px;flex-basis:38px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:420px) and (max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}.user-card{padding:12px}.person{align-items:flex-start;gap:8px}.avatar{width:40px;height:40px;flex-basis:40px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:8px}.name{font-size:15px}}
@media(prefers-reduced-motion:reduce){.user-card{transition:none}}
</style>
</head>
<body>
<main>
<header class="top">
 <div><h1>Пользователи Roadnote</h1><div class="sub">Нажми на карточку, чтобы открыть профиль VK</div></div>
 <div class="count" id="count">Загрузка…</div>
</header>
<nav class="admin-nav" aria-label="Разделы админки">
 <a class="active" href="#" aria-current="page">Пользователи</a>
 <a id="offers-link" href="#">Предложения</a>
 <a id="requests-link" href="#">Запросы</a>
</nav>
<section class="panel">
 <div class="toolbar">
  <input id="search" type="search" placeholder="Имя, VK ID или транспорт №" autocomplete="off" aria-label="Поиск пользователей">
  <select id="sort" aria-label="Сортировка">
   <option value="scans">Больше сканов</option>
   <option value="subscription">Скоро истекает подписка</option>
   <option value="lastscan">Последний скан</option>
   <option value="recent">Последние посещения</option>
   <option value="first">Первые посещения</option>
   <option value="visits">Число посещений</option>
   <option value="name">Имя</option>
  </select>
  <button class="primary" id="refresh" type="button">Обновить</button>
 </div>
 <div id="status" class="status" role="status">Проверяем доступ…</div>
 <div class="cards" id="cards" hidden></div>
 <div class="foot">Доступ к списку защищён серверной проверкой подписи VK и разрешённым VK ID. Имена и аватары загружаются из профиля; идентификатор пользователя подтверждается сервером.</div>
</section>
</main>
<script>
(() => {
 const query = window.location.search.slice(1);
 const auth = 'VK ' + btoa(unescape(encodeURIComponent(query))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const offersLink = document.getElementById('offers-link');
 if (offersLink) offersLink.href = '/roadnote/admin/offers' + window.location.search;
 const requestsLink = document.getElementById('requests-link');
 if (requestsLink) requestsLink.href = '/roadnote/admin/requests' + window.location.search;
 const status = document.getElementById('status');
 const cards = document.getElementById('cards');
 const count = document.getElementById('count');
 const search = document.getElementById('search');
 const sort = document.getElementById('sort');
 let users = [];
 const date = value => value ? new Date(value).toLocaleString('ru-RU',{day:'numeric',month:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : '—';
 const remaining = value => {
   const ms=Date.parse(value)-Date.now();
   if(!Number.isFinite(ms)||ms<=0)return 'Подписка истекла';
   const days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),minutes=Math.floor(ms%3600000/60000);
   if(days>0)return 'Осталось '+days+' дн. '+hours+' ч.';
   if(hours>0)return 'Осталось '+hours+' ч. '+minutes+' мин.';
   return 'Осталось '+Math.max(1,minutes)+' мин.';
 };
 const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function render(){
   const q=search.value.trim().toLowerCase();
   const filtered=users.filter(u=>(u.first_name+' '+u.last_name+' '+u.vk_id+' '+(u.last_transport_number||'')).toLowerCase().includes(q));
   filtered.sort((a,b)=>{
     if(sort.value==='scans') return (b.scan_balance??-1)-(a.scan_balance??-1);
     if(sort.value==='subscription') {
       const ae=a.subscription_until&&Date.parse(a.subscription_until)>Date.now()?Date.parse(a.subscription_until):Infinity;
       const be=b.subscription_until&&Date.parse(b.subscription_until)>Date.now()?Date.parse(b.subscription_until):Infinity;
       return ae-be;
     }
     if(sort.value==='lastscan') return (b.last_scan_at||'').localeCompare(a.last_scan_at||'');
     if(sort.value==='visits') return b.visit_count-a.visit_count;
     if(sort.value==='name') return (a.last_name+a.first_name).localeCompare(b.last_name+b.first_name,'ru');
     return b.last_seen.localeCompare(a.last_seen);
   });
   cards.innerHTML=filtered.map(u=>{
     const name=(u.first_name+' '+u.last_name).trim()||'Пользователь VK';
     const avatar=u.photo_url?'<img class="avatar" src="'+esc(u.photo_url)+'" alt="" referrerpolicy="no-referrer" loading="lazy">':'<span class="avatar" aria-hidden="true">VK</span>';
     const profile='https://vk.com/id'+encodeURIComponent(u.vk_id);
     const subscriptionActive=Boolean(u.subscription_until && Date.parse(u.subscription_until)>Date.now());
     const entitlementStatus=u.unlimited?'Безлимит':subscriptionActive?'Подписка':u.scan_balance===null||u.scan_balance===undefined?'Баланс не назначен':(''+u.scan_balance+' '+(Number(u.scan_balance)===1?'скан':Number(u.scan_balance)>=2&&Number(u.scan_balance)<=4?'скана':'сканов'));
     const subscriptionDetail=subscriptionActive?'<small>'+esc(remaining(u.subscription_until))+' · до '+esc(new Date(u.subscription_until).toLocaleString('ru-RU',{day:'numeric',month:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}))+'</small>':'';
     const lastScan=u.last_scan_at?date(u.last_scan_at):'Ещё не сканировал';
     const transport=[u.last_transport_type, u.last_route_number?'№ '+u.last_route_number:''].filter(Boolean).join(' ')||'—';
     return '<article class="user-card" data-user-card="'+esc(u.vk_id)+'">'+
       '<div class="person">'+avatar+'<div class="person-text"><a href="'+profile+'" target="_blank" rel="noopener noreferrer" class="name" style="color:inherit;text-decoration:none">'+esc(name)+'</a><div class="vk-id">VK ID: '+esc(u.vk_id)+' · '+esc(u.visit_count)+' посещ. · '+esc(u.scan_count||0)+' сканов</div></div></div>'+
       '<div class="stats">'+
         '<div class="stat"><span class="stat-label">Баланс сканов</span><span class="stat-value">'+esc(u.unlimited?'Безлимит':(u.scan_balance===null||u.scan_balance===undefined?'Не назначен':u.scan_balance))+'</span></div>'+
         '<div class="stat"><span class="stat-label">Подписка</span><span class="stat-value">'+esc(subscriptionActive?new Date(u.subscription_until).toLocaleDateString('ru-RU'):(u.subscription_until?'Истекла':'Нет'))+'</span></div>'+
         '<div class="stat"><span class="stat-label">Последний скан</span><span class="stat-value">'+esc(lastScan)+'</span></div>'+
         '<div class="stat"><span class="stat-label">Последний транспорт</span><span class="stat-value">'+esc(transport)+'</span></div>'+
       '</div>'+
       '<details class="scan-history" data-scan-history="'+esc(u.vk_id)+'"><summary>История сканов · '+esc(u.scan_count||0)+'</summary><div class="scan-history-list"><div class="scan-history-empty">Нажмите, чтобы загрузить историю.</div></div></details>'+
       '<details class="credit-history" data-credit-history="'+esc(u.vk_id)+'"><summary>История начислений</summary><div class="scan-history-list"><div class="scan-history-empty">Нажмите, чтобы загрузить историю.</div></div></details>'+
       '<div class="entitlement">'+
       '<details class="manage"><summary>Управление доступом</summary><div class="manage-body">'+
       '<div class="grant-section"><div class="grant-section-title">СКАНЫ</div><div class="preset-grid">'+
       '<button class="primary" type="button" data-action="grant-pack" data-amount="9">+9</button>'+
       '<button class="primary" type="button" data-action="grant-pack" data-amount="29">+29</button>'+
       '<button class="primary" type="button" data-action="grant-pack" data-amount="49">+49</button></div>'+
       '<div class="grant-grid"><input type="number" min="1" max="100000" step="1" value="9" aria-label="Своё количество сканов" data-pack-input><button class="primary" type="button" data-action="grant-pack-custom">Начислить</button></div></div>'+
       '<div class="grant-section"><div class="grant-section-title">ПОДПИСКА</div><div class="preset-grid">'+
       '<button class="primary" type="button" data-action="grant-months" data-months="1">+1 мес.</button>'+
       '<button class="primary" type="button" data-action="grant-months" data-months="3">+3 мес.</button>'+
       '<button class="primary" type="button" data-action="grant-months" data-months="6">+6 мес.</button></div>'+
       '<div class="grant-grid"><input type="number" min="1" max="120" step="1" value="1" aria-label="Своё количество месяцев" data-months-input><button class="primary" type="button" data-action="grant-months-custom">Начислить</button></div></div>'+
       '<button class="unlimited-toggle" type="button" data-action="toggle-unlimited">'+(u.unlimited?'Отключить безлимит':'Включить безлимит')+'</button>'+
       '<div class="action-status" aria-live="polite"></div></div></details></div></article>';
     }).join('');
   status.hidden=filtered.length>0;
   status.className='status';
   status.textContent=users.length?'По вашему запросу ничего не найдено':'Пока нет зарегистрированных пользователей';
   cards.hidden=filtered.length===0;
 }
 async function load(){
   if(!query){status.textContent='Откройте эту страницу из VK Mini App, чтобы проверить подпись запуска.';status.className='status error';return}
   status.hidden=false;status.className='status';status.textContent='Загрузка списка…';cards.hidden=true;
   try{
     const response=await fetch('../api/admin/users',{headers:{Authorization:auth},cache:'no-store'});
     const data=await response.json();
     if(!response.ok)throw new Error(response.status===403?'Доступ запрещён: этот аккаунт VK не является администратором.':data.error||'Не удалось загрузить список');
     users=data.users||[];count.textContent='Всего: '+data.total;render();
   }catch(e){status.hidden=false;status.className='status error';status.textContent=e.message;count.textContent='Нет доступа'}
 }
 async function performEntitlement(button){
   const card=button.closest('[data-user-card]');
   if(!card)return;
   const vkId=card.dataset.userCard;
   const message=card.querySelector('.action-status');
   let body;
   if(button.dataset.action==='grant-pack'||button.dataset.action==='grant-pack-custom'){
     const amount=button.dataset.amount!==undefined?Number(button.dataset.amount):Number(card.querySelector('[data-pack-input]').value);
     if(!Number.isSafeInteger(amount)||amount<1||amount>100000){message.className='action-status error';message.textContent='Введите количество сканов от 1 до 100000.';return}
     body={action:'grant_pack',amount};
   }else if(button.dataset.action==='grant-months'||button.dataset.action==='grant-months-custom'){
     const months=button.dataset.months!==undefined?Number(button.dataset.months):Number(card.querySelector('[data-months-input]').value);
     if(!Number.isSafeInteger(months)||months<1||months>120){message.className='action-status error';message.textContent='Введите количество месяцев от 1 до 120.';return}
     body={action:'grant_months',months};
   }else{
     const user=users.find(item=>String(item.vk_id)===vkId);
     body={action:'set_unlimited',enabled:!(user&&user.unlimited)};
   }
   button.disabled=true;message.className='action-status';message.textContent='Сохраняем…';
   try{
     const response=await fetch('../api/admin/users/'+encodeURIComponent(vkId)+'/entitlement',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
     const data=await response.json();
     if(!response.ok)throw new Error(data.error||'Не удалось изменить доступ.');
     await load();
   }catch(error){message.className='action-status error';message.textContent=error.message}
   finally{button.disabled=false}
 }
 cards.addEventListener('toggle', event => {
   const details=event.target.closest('details[data-scan-history]');
   if(!details || !details.open || details.dataset.loaded==='1' || details.dataset.loading==='1')return;
   details.dataset.loading='1';
   const list=details.querySelector('.scan-history-list');
   list.innerHTML='<div class="scan-history-empty">Загружаем историю…</div>';
   fetch('../api/admin/users/'+encodeURIComponent(details.dataset.scanHistory)+'/scans',{headers:{Authorization:auth},cache:'no-store'})
     .then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось загрузить историю.');return data;})
     .then(data=>{
       details.dataset.loaded='1';
       if(!data.scans.length){list.innerHTML='<div class="scan-history-empty">Сканов пока нет.</div>';return;}
       list.innerHTML=data.scans.map(scan=>{
         const type=[scan.transport_type,scan.route_number?'№ '+scan.route_number:''].filter(Boolean).join(' ');
         const vehicle=scan.vehicle_number?'Т/С № '+scan.vehicle_number:'Номер Т/С не указан';
         const price=scan.price===null?'':' · '+Number(scan.price).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
         return '<div class="scan-row"><div class="scan-row-main">'+esc(type||'Скан QR-кода')+' · '+esc(vehicle)+'</div><div class="scan-row-meta">'+esc(date(scan.scanned_at)+price)+'</div></div>';
       }).join('');
     })
     .catch(error=>{list.innerHTML='<div class="scan-history-empty error">'+esc(error.message)+' <button type="button" data-action="retry-scans">Повторить</button></div>';})
     .finally(()=>{delete details.dataset.loading;});
 },true);
 cards.addEventListener('toggle', event => {
   const details=event.target.closest('details[data-credit-history]');
   if(!details || !details.open || details.dataset.loaded==='1' || details.dataset.loading==='1')return;
   details.dataset.loading='1';
   const list=details.querySelector('.scan-history-list');
   list.innerHTML='<div class="scan-history-empty">Загружаем историю…</div>';
   fetch('../api/admin/users/'+encodeURIComponent(details.dataset.creditHistory)+'/credits',{headers:{Authorization:auth},cache:'no-store'})
     .then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'Не удалось загрузить историю начислений.');return data;})
     .then(data=>{
       details.dataset.loaded='1';
       if(!data.credits.length){list.innerHTML='<div class="scan-history-empty">Начислений пока нет.</div>';return;}
       list.innerHTML=data.credits.map(item=>{
         const source=item.source==='welcome'?'Приветственный бонус':item.source==='admin'?'Ручное начисление':'Начисление';
         const note=item.note?' · '+item.note:'';
         const amount=Number(item.amount);
         const plural=amount===1?'скан':amount>=2&&amount<=4?'скана':'сканов';
         return '<div class="scan-row"><div class="scan-row-main">+'+esc(amount)+' '+plural+'</div><div class="scan-row-meta">'+esc(source+note)+'<br>'+esc(date(item.credited_at))+'</div></div>';
       }).join('');
     })
     .catch(error=>{list.innerHTML='<div class="scan-history-empty error">'+esc(error.message)+' <button type="button" data-action="retry-credits">Повторить</button></div>';})
     .finally(()=>{delete details.dataset.loading;});
 },true);
 cards.addEventListener('click',event=>{
   const retry=event.target.closest('button[data-action="retry-scans"]');
   if(retry){const details=retry.closest('details[data-scan-history]');if(details){details.dataset.loaded='0';details.open=false;details.open=true;}return;}
   const retryCredits=event.target.closest('button[data-action="retry-credits"]');
   if(retryCredits){const details=retryCredits.closest('details[data-credit-history]');if(details){details.dataset.loaded='0';details.open=false;details.open=true;}return;}
   const button=event.target.closest('button[data-action]');
   if(button)performEntitlement(button);
 });
 search.addEventListener('input',render);
 sort.addEventListener('change',render);
 document.getElementById('refresh').addEventListener('click',load);
 load();
})();
</script>
</body>
</html>
