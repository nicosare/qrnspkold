<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f4">
<meta name="referrer" content="no-referrer">
<title>Roadnote — Сканирование</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  if (window.vkBridge && typeof window.vkBridge.send === 'function') {
    window.vkBridge.send('VKWebAppInit').catch(error => console.warn('VK Mini App initialization failed:', error));
  }
});
</script>
<style>
@font-face{font-family:Circe;src:local('Circe'),url('Circe-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Circe;src:local('Circe Bold'),url('Circe-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{color-scheme:light;--bg:#f2f3f4;--text:#30343a;--muted:#727983;--blue:#2787f5;--line:#e3e7ec}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;min-height:100dvh}
body{font-family:Circe,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.page{width:100%;max-width:520px;min-height:100dvh;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 auto}
.brand-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--blue);color:white;box-shadow:0 8px 18px #2787f52b}
.brand-name{font-size:21px;font-weight:700;letter-spacing:-.3px}
.brand-caption{font-size:13px;color:var(--muted);margin-top:1px}
.hero{padding:52px 0 42px;text-align:center}
.hero-icon{width:92px;height:92px;margin:0 auto 26px;display:grid;place-items:center;border-radius:28px;background:white;border:1px solid var(--line);box-shadow:0 12px 30px #19283b0b;color:var(--blue)}
h1{font-size:clamp(28px,7vw,35px);line-height:1.12;letter-spacing:-.7px;margin:0 0 15px;font-weight:700}
.description{font-size:17px;line-height:1.5;color:var(--muted);max-width:350px;margin:0 auto}
.action{margin-top:32px;width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;gap:11px;padding:15px 20px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px #2787f52b;transition:transform .15s,background .15s}
.action:active{transform:translateY(1px);background:#176dcc}
.action:focus-visible{outline:3px solid #80baff;outline-offset:3px}
.footnote{padding-top:24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
@media(min-height:760px){.hero{padding-top:72px;padding-bottom:54px}}
@media(prefers-reduced-motion:reduce){.action{transition:none}}
</style>
</head>
<body>
<main class="page">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg width="27" height="27" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 10V4a1 1 0 0 1 1-1h6M18 3h6a1 1 0 0 1 1 1v6M25 18v6a1 1 0 0 1-1 1h-6M10 25H4a1 1 0 0 1-1-1v-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="8" y="8" width="4" height="4" rx=".6" fill="currentColor"/><rect x="16" y="8" width="4" height="4" rx=".6" fill="currentColor"/><rect x="8" y="16" width="4" height="4" rx=".6" fill="currentColor"/><path d="M16 16h2v2h-2zM19 19h2v2h-2zM18 20v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div><div class="brand-name">Roadnote</div><div class="brand-caption">Транспортные данные в одном месте</div></div>
  </div>
  <section class="hero">
    <div class="hero-icon" aria-hidden="true">
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 20V8a1 1 0 0 1 1-1h12M34 7h12a1 1 0 0 1 1 1v12M47 34v12a1 1 0 0 1-1 1H34M20 47H8a1 1 0 0 1-1-1V34" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <rect x="17" y="17" width="8" height="8" rx="1.2" fill="currentColor"/><rect x="29" y="17" width="8" height="8" rx="1.2" fill="currentColor"/><rect x="17" y="29" width="8" height="8" rx="1.2" fill="currentColor"/><path d="M29 29h5v5h-5zM35 35h4v4h-4zM29 36v4" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Сканирование QR-кода</h1>
    <p class="description">Наведите камеру на QR-код транспорта НСПК. Мы распознаем данные и откроем основную страницу.</p>
    <button class="action" id="scan-button" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M3 8V4a1 1 0 0 1 1-1h4M16 3h4a1 1 0 0 1 1 1v4M21 16v4a1 1 0 0 1-1 1h-4M8 21H4a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="8" y="8" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/></svg>
      Сканировать QR-код
    </button>
  </section>
  <div class="footnote">После успешного распознавания данные транспорта загрузятся на основную страницу автоматически.</div>
</main>
<script>
document.getElementById('scan-button').addEventListener('click', () => {
  const destination = new URL('main.html', window.location.href);
  const launchParams = window.location.search.slice(1);
  destination.search = ['scan=1', launchParams].filter(Boolean).join('&');
  window.location.assign(destination.href);
});
</script>
</body>
</html>
